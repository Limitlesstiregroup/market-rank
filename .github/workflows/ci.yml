name: MarketRank CI

on:
  push:
    branches: ["main", "master", "ga/**"]
  pull_request:

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-rank
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-rank/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Security checks
        run: npm run security

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
