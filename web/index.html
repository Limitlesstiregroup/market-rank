<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarketRank — Credibility-first stock predictions</title>
    <meta name="description" content="MarketRank is an ad-free stock prediction community with credibility scoring, anti-abuse controls, and transparent trust signals." />
    <meta name="robots" content="index,follow" />
    <style>
      :root{--bg:#090f1f;--bg2:#101935;--card:#141f3f;--text:#e9efff;--muted:#a7b6dd;--accent:#4d8dff;--ok:#45c26b;--warn:#ffb64d;--bad:#ff6b6b;--line:#2d3f75}
      *{box-sizing:border-box}
      body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text)}
      .wrap{max-width:1080px;margin:0 auto;padding:20px}
      .hero h1{margin:0 0 6px;font-size:clamp(1.5rem,2.8vw,2.25rem)}
      .hero p{margin:0;color:var(--muted)}
      .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-top:14px}
      .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
      .card h2{font-size:1.05rem;margin:0 0 10px}
      .row{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
      .field{display:flex;flex-direction:column;gap:6px}
      label{font-size:.9rem;color:var(--muted)}
      input,select,button{padding:10px;border-radius:10px;border:1px solid var(--line);background:#0c1430;color:var(--text)}
      button{background:linear-gradient(180deg,#5c97ff,#3a78e6);border:none;font-weight:700;cursor:pointer}
      button.secondary{background:#23345f}
      button:disabled{opacity:.6;cursor:not-allowed}
      .actions{display:flex;gap:8px;flex-wrap:wrap}
      .status{margin-top:10px;font-size:.92rem;color:var(--muted)}
      .status.ok{color:var(--ok)}
      .status.err{color:var(--bad)}
      .leader{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #20335f}
      .leader:last-child{border-bottom:none}
      .score{font-weight:800}
      .pill{font-size:.78rem;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
      .loading{color:var(--warn)}
      @media (max-width:640px){.wrap{padding:14px}}
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="hero" aria-label="Introduction">
        <h1>MarketRank</h1>
        <p>Ad-free stock predictions with transparent credibility scoring.</p>
      </section>

      <section class="grid" aria-label="Core app panels">
        <article class="card" aria-labelledby="auth-title">
          <h2 id="auth-title">Account</h2>
          <div class="row">
            <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" placeholder="name@example.com" /></div>
            <div class="field"><label for="password">Password</label><input id="password" type="password" minlength="8" autocomplete="current-password" placeholder="At least 8 characters" /></div>
          </div>
          <div class="actions" style="margin-top:10px">
            <button id="registerBtn" onclick="register()">Register</button>
            <button id="loginBtn" class="secondary" onclick="login()">Login</button>
          </div>
          <p id="auth" class="status" role="status" aria-live="polite"></p>
        </article>

        <article class="card" aria-labelledby="pred-title">
          <h2 id="pred-title">Post prediction</h2>
          <div class="row">
            <div class="field"><label for="ticker">Ticker</label><input id="ticker" maxlength="8" placeholder="AAPL" /></div>
            <div class="field"><label for="direction">Direction</label><select id="direction"><option value="bull">Bull</option><option value="bear">Bear</option></select></div>
            <div class="field"><label for="target">Target price</label><input id="target" type="number" min="0.01" step="0.01" placeholder="250" /></div>
            <div class="field"><label for="horizon">Horizon date</label><input id="horizon" type="date" /></div>
            <div class="field"><label for="confidence">Confidence (0-1)</label><input id="confidence" type="number" step="0.01" min="0" max="1" value="0.7" /></div>
          </div>
          <div class="actions" style="margin-top:10px">
            <button id="postBtn" onclick="postPrediction()">Post prediction</button>
          </div>
          <p id="predStatus" class="status" role="status" aria-live="polite"></p>
        </article>
      </section>

      <section class="card" aria-labelledby="leaderboard-title" style="margin-top:14px">
        <h2 id="leaderboard-title">Leaderboard <span class="pill">0–100 trust</span></h2>
        <div id="board" role="status" aria-live="polite" class="loading">Loading leaderboard...</div>
      </section>

      <section class="card" aria-labelledby="moderation-title" style="margin-top:14px">
        <h2 id="moderation-title">Moderator dashboard</h2>
        <div class="row">
          <div class="field"><label for="moderatorKey">Moderator key</label><input id="moderatorKey" type="password" placeholder="x-moderator-key" /></div>
        </div>
        <div class="actions" style="margin-top:10px">
          <button id="modRefreshBtn" class="secondary" onclick="loadModerationDashboard()">Refresh moderation</button>
        </div>
        <p id="modStatus" class="status" role="status" aria-live="polite"></p>
        <div id="modSummary" class="status"></div>
        <div id="modBoard" class="status"></div>
      </section>
    </main>

    <script>
      let token = null;

      function setStatus(el, message, mode = '') {
        el.className = `status ${mode}`.trim();
        el.textContent = message;
      }

      function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v || '').trim()); }

      async function api(path, options = {}) {
        const res = await fetch(path, options);
        let data = null;
        try { data = await res.json(); } catch (_) { data = null; }
        if (!res.ok) throw new Error(data?.error || `Request failed (${res.status})`);
        return data;
      }

      async function register() {
        const registerBtn = document.getElementById('registerBtn');
        const auth = document.getElementById('auth');
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        if (!isEmail(email)) return setStatus(auth, 'Please enter a valid email.', 'err');
        if (password.length < 8) return setStatus(auth, 'Password must be at least 8 characters.', 'err');

        registerBtn.disabled = true;
        setStatus(auth, 'Creating your account...', '');
        try {
          await api('/api/auth/register', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, password }) });
          setStatus(auth, 'Registered successfully. You can now log in.', 'ok');
        } catch (e) {
          setStatus(auth, e.message, 'err');
        } finally {
          registerBtn.disabled = false;
        }
      }

      async function login() {
        const loginBtn = document.getElementById('loginBtn');
        const auth = document.getElementById('auth');
        const email = document.getElementById('email').value.trim().toLowerCase();
        const password = document.getElementById('password').value;

        loginBtn.disabled = true;
        setStatus(auth, 'Signing in...', '');
        try {
          const data = await api('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email, password }) });
          token = data.token;
          setStatus(auth, `Logged in. Trust score: ${data.user.trustScore}`, 'ok');
        } catch (e) {
          token = null;
          setStatus(auth, e.message, 'err');
        } finally {
          loginBtn.disabled = false;
        }
      }

      async function postPrediction() {
        const postBtn = document.getElementById('postBtn');
        const predStatus = document.getElementById('predStatus');
        const ticker = document.getElementById('ticker').value.trim().toUpperCase();
        const direction = document.getElementById('direction').value;
        const targetPrice = Number(document.getElementById('target').value);
        const horizonDate = document.getElementById('horizon').value;
        const confidence = Number(document.getElementById('confidence').value);

        if (!token) return setStatus(predStatus, 'Please log in first.', 'err');
        if (!/^[A-Z]{1,8}$/.test(ticker)) return setStatus(predStatus, 'Ticker must be 1–8 letters.', 'err');
        if (!Number.isFinite(targetPrice) || targetPrice <= 0) return setStatus(predStatus, 'Target price must be positive.', 'err');
        if (!horizonDate) return setStatus(predStatus, 'Please choose a horizon date.', 'err');
        if (!Number.isFinite(confidence) || confidence < 0 || confidence > 1) return setStatus(predStatus, 'Confidence must be between 0 and 1.', 'err');

        postBtn.disabled = true;
        setStatus(predStatus, 'Posting prediction...', '');
        try {
          const data = await api('/api/predictions', {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
            body: JSON.stringify({ ticker, direction, targetPrice, horizonDate, confidence })
          });
          setStatus(predStatus, `Prediction posted. Trust score: ${data.trustScore}`, 'ok');
          await loadBoard();
        } catch (e) {
          setStatus(predStatus, e.message, 'err');
        } finally {
          postBtn.disabled = false;
        }
      }

      async function loadBoard() {
        const board = document.getElementById('board');
        board.className = 'loading';
        board.textContent = 'Loading leaderboard...';
        try {
          const data = await api('/api/leaderboard');
          const users = data.leaderboard || [];
          if (!users.length) {
            board.className = '';
            board.textContent = 'No users yet. Create an account to get started.';
            return;
          }
          board.className = '';
          board.innerHTML = users.map((u, i) => `
            <div class="leader">
              <div>#${i + 1} ${u.email}</div>
              <div><span class="score">${u.trustScore}</span> · Sybil risk ${u.sybilRisk}% · ${u.predictionCount} preds</div>
            </div>
          `).join('');
        } catch (e) {
          board.className = 'status err';
          board.textContent = e.message;
        }
      }

      async function loadModerationDashboard() {
        const modRefreshBtn = document.getElementById('modRefreshBtn');
        const modStatus = document.getElementById('modStatus');
        const modSummary = document.getElementById('modSummary');
        const modBoard = document.getElementById('modBoard');
        const moderatorKey = document.getElementById('moderatorKey').value.trim();

        if (!moderatorKey) return setStatus(modStatus, 'Enter moderator key to load dashboard.', 'err');

        modRefreshBtn.disabled = true;
        setStatus(modStatus, 'Loading moderation dashboard...', '');

        try {
          const data = await api('/api/moderation/dashboard', {
            method: 'GET',
            headers: { 'x-moderator-key': moderatorKey }
          });

          setStatus(modStatus, 'Moderator dashboard loaded.', 'ok');
          modSummary.innerHTML = `
            <div class="leader"><div>Total users</div><div><span class="score">${data.summary.users}</span></div></div>
            <div class="leader"><div>Total predictions</div><div><span class="score">${data.summary.predictions}</span></div></div>
            <div class="leader"><div>Flagged predictions</div><div><span class="score">${data.summary.flaggedPredictions}</span></div></div>
            <div class="leader"><div>Active bans</div><div><span class="score">${data.summary.activeBans}</span></div></div>
            <div class="leader"><div>Open appeals</div><div><span class="score">${data.summary.openAppeals}</span></div></div>
          `;

          const flagged = (data.flaggedPredictions || []).slice(0, 5).map((p) => (
            `<div class="leader"><div>${p.ticker} · ${p.ownerEmail || p.userId}</div><div>${p.flagCount} flags</div></div>`
          )).join('') || '<div class="status">No flagged predictions.</div>';

          const appeals = (data.openAppeals || []).slice(0, 5).map((a) => (
            `<div class="leader"><div>${a.userEmail || a.userId}</div><div>${new Date(a.createdAt).toLocaleString()}</div></div>`
          )).join('') || '<div class="status">No open appeals.</div>';

          modBoard.innerHTML = `
            <h3 style="margin:12px 0 6px">Top flagged predictions</h3>
            ${flagged}
            <h3 style="margin:12px 0 6px">Open appeals</h3>
            ${appeals}
          `;
        } catch (e) {
          modSummary.textContent = '';
          modBoard.textContent = '';
          setStatus(modStatus, e.message, 'err');
        } finally {
          modRefreshBtn.disabled = false;
        }
      }

      loadBoard();
    </script>
  </body>
</html>
